schema = 1
[module]
id = "corona"
version = "0.3.0"
version_code = 3
kind = "target"
language = "c"
lifecycle = "resident-after-activation"
canopus_abi = "2"
[build]
sources = [
    "src/module.c", "src/resource_hook.c", "src/config.c",
    "src/calendar_config.c", "src/calendar_icon.c", "src/calendar_native.c",
    "src/launcher_background.c", "src/platform.c", "src/platform_fs.c", "src/platform_memory.c",
    "src/font_reload.c", "src/quickapp_icon.c",
    "src/manager_config_store.c", "src/manager_data.c",
    "src/manager_assets.c", "src/manager_ui.c",
    "${CANOPUS_ROOT}/runtime/control/canopus_control.c",
]
include_dirs = ["include"]

[targets]
# Initial native UI targets; each requires its own emulator acceptance run.
include = ["xiaomi-band-11-4.100.155", "xiaomi-band-10-pro-3.101.043"]
[capabilities]
required = []
[resources]
# LVGL v9 image resources shipped inside the .canopus package and extracted by
# the installer into the module data root. Never embedded in the ELF.
files = [
    "build/manager-resources/status-running.bin",
    "build/manager-resources/status-config-error.bin",
    "build/manager-resources/status-unresponsive.bin",
    "build/manager-resources/reload.bin",
    "build/manager-resources/reload-wide.bin",
    "build/manager-resources/del.bin",
    "build/manager-resources/del-wide.bin",
    "build/manager-resources/none.bin",
    "build/manager-resources/connect.bin",
    "build/manager-resources/choose.bin",
    "build/manager-resources/download.bin",
    "build/manager-resources/error.bin",
    "build/manager-resources/succ.bin",
    "build/manager-resources/logo.bin",
]
